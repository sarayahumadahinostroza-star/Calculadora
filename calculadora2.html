<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Suma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #81D8D0;
        }
        .calculator {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            margin: 0 0 15px 0;
            color: #333;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            margin: 10px;
            width: 120px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #resultado {
            font-size: 24px;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Calculadora de Suma</h1>
        <p><strong>Ingresa dos números:</strong></p>
        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
        <br><br>
        <button onclick="sumar()">Sumar</button>
        <p id="resultado">Resultado: <span id="resultadoValor">0</span></p>
    </div>

    <script>
        function sumar() {
            const num1 = parseFloat(document.getElementById("num1").value);
            const num2 = parseFloat(document.getElementById("num2").value);

            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("resultadoValor").innerText = "Por favor, ingresa números válidos";
                return;
            }

            const suma = num1 + num2;
            document.getElementById("resultadoValor").innerText = suma;
        }
    </script>
</body>
</html>
